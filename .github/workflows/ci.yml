name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commerce_user
          POSTGRES_PASSWORD: commerce_password
          POSTGRES_DB: commerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce_user -d commerce_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://commerce_user:commerce_password@localhost:5432/commerce_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -q
      